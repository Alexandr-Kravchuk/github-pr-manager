name: Release

# Manual release. Bump "version" in package.json first, then run this workflow.
# It builds the Windows installer and publishes a DRAFT GitHub Release
# (v<version>) with the .exe + latest.yml (the electron-updater Windows feed).
#
# The macOS DMG/ZIP + latest-mac.yml are built and signed locally on a Mac with
# a Developer ID certificate and uploaded to the SAME release:
#   UPLOAD_RELEASE=1 GH_TOKEN=<token> \
#   MAC_CERT_P12=... MAC_CERT_PASSWORD=... \
#   APPLE_API_KEY=... APPLE_API_KEY_ID=... APPLE_API_ISSUER=... \
#   npm run release:mac
#
# Then review and publish the draft release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to a draft GitHub Release (disable for a signing smoke test)
        type: boolean
        default: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release-windows:
    name: Build & publish Windows
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Test the certificate trust installer
        shell: pwsh
        run: ./tests/windows-trust-script.tests.ps1
      - name: Trust the public signing certificate on the build runner
        timeout-minutes: 2
        shell: pwsh
        run: |
          Import-Certificate -FilePath build/windows-signing/PR-Dashboard.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath build/windows-signing/PR-Dashboard.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
      - name: Build signed Windows installer
        run: npx --no-install electron-builder --win nsis --publish never --config.forceCodeSigning=true
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify signatures and prepare release assets
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1
      - name: Keep verified assets for a signing smoke test
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: dist/windows-release/*
          if-no-files-found: error
      - name: Upload Windows assets to a draft release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$(node -p "require('./package.json').version")"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases' }
          $release = @($releases | Where-Object tag_name -eq $tag)
          if ($release.Count -gt 1) { throw "Duplicate releases for $tag" }
          if ($release.Count -eq 0) {
            gh release create $tag --draft --title "Release $($tag.Substring(1))" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          } elseif (-not $release[0].draft) { throw "Release $tag is already published" }
          $assets = @(Get-ChildItem dist/windows-release -File | ForEach-Object FullName)
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
